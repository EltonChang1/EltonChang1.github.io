<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Assay project summary</title>
  <desc id="description">A diagram of the Assay development foundation: an isolated SQL worker, a claim check against result cells, and one fenced publication path. A correct 200 dollar total is accepted and a duplicated-join 340 dollar total is rejected.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10140f"/>
      <stop offset="1" stop-color="#1d2a22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7ff6a"/>
      <stop offset="1" stop-color="#8fd6a0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#050805" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1460" cy="70" r="280" fill="#d7ff6a" opacity="0.07"/>
  <circle cx="40" cy="860" r="260" fill="#8fd6a0" opacity="0.06"/>

  <text x="110" y="128" fill="#d7ff6a" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">AI SAFETY RESEARCH</text>
  <text x="110" y="206" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="760">Assay</text>
  <text x="110" y="258" fill="#c5d2c6" font-family="Inter, Arial, sans-serif" font-size="28">Check a released number against the query that produced it.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="330" width="400" height="300" rx="28" fill="#18241c" stroke="#3d5344" stroke-width="2"/>
    <text x="148" y="388" fill="#d7ff6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">ISOLATED SQL</text>
    <g fill="#e7f0e6" font-family="Inter, Arial, sans-serif" font-size="26">
      <text x="148" y="460">Pinned Docker worker</text>
      <text x="148" y="514">Read-only snapshot</text>
      <text x="148" y="568">No host execution</text>
    </g>

    <rect x="600" y="330" width="400" height="300" rx="28" fill="#18241c" stroke="#3d5344" stroke-width="2"/>
    <text x="638" y="388" fill="#d7ff6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">CLAIM CHECK</text>
    <g fill="#e7f0e6" font-family="Inter, Arial, sans-serif" font-size="26">
      <text x="638" y="460">Bind to result cells</text>
      <text x="638" y="514">Keep the receipt</text>
      <text x="638" y="568">Reject a bad total</text>
    </g>

    <rect x="1090" y="330" width="400" height="300" rx="28" fill="#18241c" stroke="#3d5344" stroke-width="2"/>
    <text x="1128" y="388" fill="#d7ff6a" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">FENCED RELEASE</text>
    <g fill="#e7f0e6" font-family="Inter, Arial, sans-serif" font-size="26">
      <text x="1128" y="460">One publisher</text>
      <text x="1128" y="514">Stale sources fail</text>
      <text x="1128" y="568">Local evidence store</text>
    </g>
  </g>

  <path d="M530 480H575" stroke="#d7ff6a" stroke-width="5" stroke-linecap="round"/>
  <path d="M555 462L578 480L555 498" fill="none" stroke="#d7ff6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1020 480H1065" stroke="#d7ff6a" stroke-width="5" stroke-linecap="round"/>
  <path d="M1045 462L1068 480L1045 498" fill="none" stroke="#d7ff6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="110" y="760" fill="#ffffff" font-size="42" font-weight="760">USD 200.00</text>
    <text x="110" y="800" fill="#9aaf9d" font-size="22">ACCEPTED TOTAL</text>
    <line x1="430" y1="730" x2="430" y2="810" stroke="#3d5344" stroke-width="2"/>
    <text x="480" y="760" fill="#ffffff" font-size="42" font-weight="760">USD 340.00</text>
    <text x="480" y="800" fill="#9aaf9d" font-size="22">DUPLICATED JOIN, REJECTED</text>
    <text x="110" y="860" fill="#9aaf9d" font-size="20">Development foundation. Not a safety result.</text>
    <rect x="1128" y="742" width="220" height="8" rx="4" fill="url(#accent)"/>
  </g>
</svg>
