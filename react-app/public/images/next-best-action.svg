<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Next Best Action project summary</title>
  <desc id="description">A confidentiality-safe diagram showing behavioral signals entering a model ensemble and producing three ranked recommendations, with ROC AUC and top-three hit-rate metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#102d45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#67e8a5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1430" cy="80" r="310" fill="#39d0a0" opacity="0.08"/>
  <circle cx="90" cy="850" r="300" fill="#60a5fa" opacity="0.07"/>

  <text x="110" y="130" fill="#8ee8d2" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">MACHINE LEARNING CASE STUDY</text>
  <text x="110" y="205" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="760">Next Best Action</text>
  <text x="110" y="255" fill="#b8c8d8" font-family="Inter, Arial, sans-serif" font-size="28">Rank relevant, supported opportunities for advisor review.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="340" width="360" height="340" rx="30" fill="#10283c" stroke="#31516b" stroke-width="2"/>
    <text x="150" y="400" fill="#8ee8d2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SIGNALS</text>
    <g fill="#dce8f2" font-family="Inter, Arial, sans-serif" font-size="25">
      <text x="150" y="470">Client behavior</text>
      <text x="150" y="525">Product holdings</text>
      <text x="150" y="580">Engagement history</text>
      <text x="150" y="635">Next-month target</text>
    </g>

    <rect x="620" y="340" width="360" height="340" rx="30" fill="#10283c" stroke="#31516b" stroke-width="2"/>
    <text x="660" y="400" fill="#8ee8d2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">MODEL ENSEMBLE</text>
    <g fill="#dce8f2" font-family="Inter, Arial, sans-serif" font-size="25">
      <text x="660" y="470">HistGradientBoosting</text>
      <text x="660" y="525">LightGBM</text>
      <text x="660" y="580">XGBoost</text>
    </g>
    <rect x="660" y="615" width="260" height="10" rx="5" fill="url(#accent)"/>

    <rect x="1130" y="340" width="360" height="340" rx="30" fill="#10283c" stroke="#31516b" stroke-width="2"/>
    <text x="1170" y="400" fill="#8ee8d2" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">RANKED ACTIONS</text>
    <g font-family="Inter, Arial, sans-serif" font-size="24">
      <circle cx="1200" cy="470" r="25" fill="#4fd1c5"/><text x="1193" y="478" fill="#071827" font-weight="800">1</text><text x="1245" y="478" fill="#dce8f2">Best supported fit</text>
      <circle cx="1200" cy="540" r="25" fill="#5ddbb4"/><text x="1193" y="548" fill="#071827" font-weight="800">2</text><text x="1245" y="548" fill="#dce8f2">Second opportunity</text>
      <circle cx="1200" cy="610" r="25" fill="#67e8a5"/><text x="1193" y="618" fill="#071827" font-weight="800">3</text><text x="1245" y="618" fill="#dce8f2">Third opportunity</text>
    </g>
  </g>

  <path d="M490 510H595" stroke="#77dcc7" stroke-width="5" stroke-linecap="round"/>
  <path d="M575 492L598 510L575 528" fill="none" stroke="#77dcc7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1000 510H1105" stroke="#77dcc7" stroke-width="5" stroke-linecap="round"/>
  <path d="M1085 492L1108 510L1085 528" fill="none" stroke="#77dcc7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="110" y="795" fill="#ffffff" font-size="54" font-weight="780">0.811</text>
    <text x="110" y="835" fill="#9fb3c5" font-size="22">ROC AUC</text>
    <line x1="330" y1="770" x2="330" y2="845" stroke="#31516b" stroke-width="2"/>
    <text x="390" y="795" fill="#ffffff" font-size="54" font-weight="780">95%</text>
    <text x="390" y="835" fill="#9fb3c5" font-size="22">TOP-3 HIT RATE</text>
    <text x="1035" y="820" fill="#9fb3c5" font-size="20">Carnegie Mellon × PNC collaboration</text>
  </g>
</svg>
